name: CI

# Runs entirely without the copyrighted Luxor 3 assets: the C++ core is
# exercised against the synthetic fixture in tests/fixtures/mini_game.
# See docs/ASSET_POLICY.md.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core build and headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Build core (no SDL2 required)
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build --target luxor3_test luxor3_preview luxor3_config_audit luxor3_level_audit

      - name: Run headless tests against the synthetic fixture
        working-directory: src
        run: ./build/luxor3_test ../tests/fixtures/mini_game

      - name: Audit parsed configuration metadata in fixture
        working-directory: src
        run: |
          ./build/luxor3_config_audit ../tests/fixtures/mini_game > config_audit.txt
          cat config_audit.txt
          grep -q 'map files: 1, loaded: 1, failed: 0' config_audit.txt
          grep -q 'GameVariables.txt: keys=7 includes=1' config_audit.txt
          grep -q 'DifficultyGameVariables.txt: keys=2 includes=0' config_audit.txt

      - name: Render a preview frame from the fixture
        working-directory: src
        run: |
          ./build/luxor3_preview ../tests/fixtures/mini_game \
            ../tests/fixtures/mini_game/data/levels/classic/T_1_1.lvl \
            preview.png
          test -s preview.png
          python3 - <<'EOF'
          import struct
          with open('preview.png','rb') as f:
              head = f.read(24)
          assert head[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          w, h = struct.unpack('>II', head[16:24])
          print(f'preview.png is {w}x{h}')
          assert (w, h) == (800, 600), f'unexpected size {w}x{h}'
          EOF

      - name: Regenerate the fixture and confirm it is reproducible
        run: |
          python3 tools/make_fixture.py /tmp/fixture_check
          diff -r tests/fixtures/mini_game /tmp/fixture_check

      - name: Check that no copyrighted assets are tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(luxor3\.exe|fmod\.dll)$'; then
            echo "::error::copyrighted binaries must not be tracked"
            exit 1
          fi
          if git ls-files | grep -E '^data/'; then
            echo "::error::the game data tree must not be tracked"
            exit 1
          fi

  python-tools:
    name: Data analysis tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Compile-check the tools
        run: |
          python3 -m py_compile \
            tools/luxor_parse.py \
            tools/asset_audit.py \
            tools/asset_inventory.py \
            tools/case_audit.py \
            tools/pe_probe.py \
            tools/make_fixture.py \
            tools/package_sdcard.py

      - name: Exercise the parser on the fixture
        run: |
          python3 tools/luxor_parse.py track \
            tests/fixtures/mini_game/data/maps/testmap/path.LX3TRK
          python3 tools/luxor_parse.py level \
            tests/fixtures/mini_game/data/levels/classic/T_1_1.lvl > /dev/null
          python3 tools/luxor_parse.py validate tests/fixtures/mini_game

  cross-build:
    name: Cross-build ARM64
    # Jammy's cross toolchain has an older glibc sysroot, closer to the target.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            cmake ninja-build pkg-config

      - name: Build the ARM64 sysroot
        run: |
          # Ubuntu's arm64 packages live on ports.ubuntu.com. They cannot be
          # installed with apt here: multiarch conflicts with the runner's
          # own amd64 libc6-dev / glib2.0-dev, and Jammy arm64 packages clash
          # with the runner's Noble "t64" variants.
          #
          # Instead, download the .deb files and extract them into a plain
          # sysroot. Only the headers and the shared objects are needed; the
          # target device provides the runtime libraries.
          set -euo pipefail
          SYSROOT=/opt/arm64-sysroot
          mkdir -p "$SYSROOT" /tmp/arm64-debs
          cd /tmp/arm64-debs
          BASE=http://ports.ubuntu.com/ubuntu-ports
          for url in \
            "$BASE/pool/universe/libs/libsdl2/libsdl2-dev_2.0.20+dfsg-2build1_arm64.deb" \
            "$BASE/pool/main/libs/libsdl2/libsdl2-2.0-0_2.0.20+dfsg-2build1_arm64.deb" \
            "$BASE/pool/main/libg/libglvnd/libgles2_1.4.0-1_arm64.deb" \
            "$BASE/pool/main/libg/libglvnd/libglvnd0_1.4.0-1_arm64.deb" \
            "$BASE/pool/main/libg/libglvnd/libgl1_1.4.0-1_arm64.deb" ; do
            curl -sSLO "$url"
          done
          for deb in *.deb; do dpkg-deb -x "$deb" "$SYSROOT"; done
          # libgles2 ships only the runtime SONAME; the linker wants the
          # development symlink.
          ln -sf libGLESv2.so.2 "$SYSROOT/usr/lib/aarch64-linux-gnu/libGLESv2.so"
          echo "sysroot contents:"
          ls "$SYSROOT/usr/lib/aarch64-linux-gnu" | grep -E 'libSDL2|libGLESv2'
          ls "$SYSROOT/usr/include/aarch64-linux-gnu/SDL2" | head -3

      - name: Cross-build the SDL2 backends for ARM64
        working-directory: src
        run: |
          SYSROOT=/opt/arm64-sysroot
          cmake -S . -B build-aarch64 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-I$SYSROOT/usr/include/aarch64-linux-gnu" \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -I$SYSROOT/usr/include/aarch64-linux-gnu" \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined -Wl,-rpath-link,$SYSROOT/usr/lib/aarch64-linux-gnu" \
                -DSDL2_LIBRARY="$SYSROOT/usr/lib/aarch64-linux-gnu/libSDL2.so" \
                -DSDL2_INCLUDE_DIR="$SYSROOT/usr/include/SDL2" \
                -DGLESV2_LIBRARY="$SYSROOT/usr/lib/aarch64-linux-gnu/libGLESv2.so"
          cmake --build build-aarch64 --target luxor3 luxor3_gl device_probe

      - name: Verify the output is ARM64
        working-directory: src
        run: |
          file build-aarch64/luxor3
          file build-aarch64/luxor3_gl
          file build-aarch64/device_probe
          readelf -h build-aarch64/luxor3 | grep -E 'Class:|Machine:'
          readelf -h build-aarch64/luxor3 | grep -q 'AArch64'
          # The device provides these at runtime; the binaries must not
          # statically embed anything.
          readelf -d build-aarch64/luxor3 | grep -q 'libSDL2-2.0.so.0'
          # The binary must not require a newer glibc than the device has.
          if readelf -V build-aarch64/luxor3 | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | grep -q 'GLIBC_2.3[6-9]'; then
            echo "::error::binary requires a glibc newer than the device provides"
            exit 1
          fi

      - name: Upload the ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luxor3-aarch64
          path: |
            src/build-aarch64/luxor3
            src/build-aarch64/luxor3_gl
            src/build-aarch64/device_probe
          if-no-files-found: error
